name: Check release signing secrets
description: Reports which of the four RELEASE_* signing secrets are missing or empty. Fails or warns, per input.

# A composite action cannot read the secrets context, so callers pass the four values as inputs.

inputs:
  keystore:
    description: Value of the RELEASE_KEYSTORE_BASE64 repository secret.
    required: true
  store-password:
    description: Value of the RELEASE_STORE_PASSWORD repository secret.
    required: true
  key-alias:
    description: Value of the RELEASE_KEY_ALIAS repository secret.
    required: true
  key-password:
    description: Value of the RELEASE_KEY_PASSWORD repository secret.
    required: true
  fail-on-missing:
    description: Set to 'true' to exit non-zero when a secret is missing or empty; anything else only emits a workflow warning.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Check the four RELEASE_* secrets
      shell: bash
      env:
        FAIL_ON_MISSING: ${{ inputs.fail-on-missing }}
        KEYSTORE: ${{ inputs.keystore }}
        STORE_PASSWORD: ${{ inputs.store-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
      run: |
        missing=''
        [ -n "$KEYSTORE" ] || missing="$missing RELEASE_KEYSTORE_BASE64"
        [ -n "$STORE_PASSWORD" ] || missing="$missing RELEASE_STORE_PASSWORD"
        [ -n "$KEY_ALIAS" ] || missing="$missing RELEASE_KEY_ALIAS"
        [ -n "$KEY_PASSWORD" ] || missing="$missing RELEASE_KEY_PASSWORD"
        if [ -z "$missing" ]; then
          echo "All four release signing secrets are present."
          exit 0
        fi
        if [ "$FAIL_ON_MISSING" = 'true' ]; then
          echo "::error::Repository secrets not set:$missing (see docs/releasing.md)"
          exit 1
        fi
        echo "::warning::Release signing secrets are missing or empty:$missing — a tagged release would stop at its guard step (see docs/releasing.md)"

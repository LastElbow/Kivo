name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, and test
        run: ./gradlew :app:assembleDebug :app:check

  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  signing-secrets:
    name: Check release signing secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Warn about missing release secrets
        uses: ./.github/actions/check-signing-secrets
        with:
          keystore: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.RELEASE_STORE_PASSWORD }}
          key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

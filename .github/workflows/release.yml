name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: echo "tag=${DISPATCH_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the signing secrets exist
        uses: ./.github/actions/check-signing-secrets
        with:
          fail-on-missing: 'true'

      - name: Decode the keystore
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Assemble the signed release
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:check

      - name: Keep the R8 mapping for retracing
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ steps.release.outputs.tag }}
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Verify and name the APK
        id: apk
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::assembleRelease produced no signed APK"
            exit 1
          fi
          name="kivo-${TAG#v}.apk"
          cp "$apk" "$name"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          build_tools=$(ls -d "$sdk"/build-tools/* | sort -V | tail -n 1)
          version=$("$build_tools/aapt2" dump badging "$name" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          expected="${TAG#v}"
          if [ "$version" != "$expected" ]; then
            echo "::error::APK versionName '$version' does not match tag '$TAG' (expected '$expected'); bump versionName in app/build.gradle.kts and re-tag"
            exit 1
          fi
          "$build_tools/apksigner" verify --print-certs "$name"
          {
            echo "apk=$name"
            echo "sha256=$(sha256sum "$name" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Kivo $TAG" --generate-notes --verify-tag
          fi

      - name: Summarise the release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          APK: ${{ steps.apk.outputs.apk }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          {
            echo "### Kivo $TAG"
            echo
            echo '| Artifact | SHA-256 |'
            echo '| --- | --- |'
            echo "| $APK | \`$SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"
